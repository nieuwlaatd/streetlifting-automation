name: Hevy synchroniseren

# Haalt de Hevy-historie op en zet de berekende programmastand in de repo,
# zodat de Claude-routines hem kunnen lezen zonder zelf naar buiten te bellen.

on:
  schedule:
    # 05:15 UTC, ruim voor het dagbericht van 06:00 UTC
    - cron: "15 5 * * *"
    # 16:15 UTC op zondag, voor het weekrapport van 17:00 UTC
    - cron: "15 16 * * 0"
    # 20:30 UTC, oftewel 22:30 bij Dylan: een avondtraining staat daarmee
    # dezelfde dag nog in het document van de coach in plaats van pas morgen.
    - cron: "30 20 * * *"
  # Bij een wijziging in de code, zodat een aanpassing meteen doorwerkt.
  # data/ is uitgezonderd: anders zou de eigen datacommit zichzelf opnieuw starten.
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'

  # Handmatig starten vanaf het tabblad Actions
  workflow_dispatch:
  # Aanhaakpunt voor de Hevy-webhook, via een relay die een
  # repository_dispatch met type "hevy-workout" stuurt
  repository_dispatch:
    types: [hevy-workout]

permissions:
  contents: write

concurrency:
  group: hevy-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Het secret staat als ENVIRONMENT secret, niet als repository secret.
    # Zonder deze regel is secrets.HEVY_API_KEY leeg.
    environment: Hevy_api_key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Alleen coach_schema.py heeft een pakket nodig; de rest is standaardbibliotheek.
      - name: Afhankelijkheden
        run: pip install --quiet openpyxl google-auth google-api-python-client

      - name: Hevy ophalen en doorrekenen
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
        run: python scripts/hevy_sync.py

      # Valt Google even weg, dan draait de rest door op het schema dat al in
      # de repo staat. Beter een dag oude routine dan helemaal geen routine.
      - name: Schema van coach Kaj ophalen
        continue-on-error: true
        run: python scripts/coach_schema.py

      - name: Routines in Hevy bijwerken
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
        run: python scripts/hevy_routines.py

      # Zonder GOOGLE_SERVICE_ACCOUNT slaat dit script zichzelf netjes over.
      - name: Sessies naar de Sheet van Kaj schrijven
        continue-on-error: true
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: python scripts/sheets_log.py

      - name: Wijzigingen vastleggen
        run: |
          git config user.name "hevy-sync"
          git config user.email "hevy-sync@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Niets veranderd."
          else
            git commit -m "Hevy-data bijgewerkt $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
